name: xnu

# Builds the avicii kernel on a macOS runner. Linux cannot do this: the kernel
# needs Xcode, mig, libfirehose_kernel and the KDK, all macOS-only.
#
# The whole series in xnu-avicii/series is applied FIRST, by this workflow, in
# order, with `git apply --check` in front of every file. blacktop's build.sh
# would otherwise apply patches in glob order and downgrade a failure to a
# warning; with the files staged outside its patches/ dir nothing is skipped
# silently. xnu-avicii/series is the only order that exists.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = apply the series and stop, build = full kernel build"
        type: choice
        options: [dry-run, build]
        default: build
      macos_version:
        description: "macOS release whose xnu to build (13.5 = xnu-8796.141.3, iOS 16 era)"
        default: "13.5"
      kernel_config:
        description: "DEVELOPMENT / RELEASE / DEBUG"
        default: DEVELOPMENT
      machine_config:
        description: "xnu MACHINE_CONFIG"
        default: SWEET
      keep_going:
        description: "make -k (collect every compile error in one run)"
        default: "true"
  push:
    branches: [main]
    paths:
      - "xnu-avicii/patches/**"
      - "xnu-avicii/series"
      - "xnu-avicii/tools/check-hunk-counts.py"
      - ".github/workflows/xnu.yml"

# concurrency removed for diagnosis 2026-11-12: every dispatch was cancelled in 2 s

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  XNU_REPO: https://github.com/apple-oss-distributions/xnu
  # macOS 13.5 ships xnu-8796.141.3 (Apple release.json for macos-135). The
  # series was written against this exact tag; the resolve step below re-checks
  # it so a repointed release fails here instead of producing a wrong kernel.
  XNU_TAG: xnu-8796.141.3
  HFS_TAG_NOTE: hfs/pthread/BearSSL are fetched pinned by xnu-avicii/patches/*.sh
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SWEET' }}
  MODE: ${{ inputs.mode || 'build' }}

jobs:
  build:
    # macOS 14 ships Xcode 15.x: its `iig` still matches the xnu-8796 IORPC ABI.
    # Xcode 16's iig emits IORPC.kernelContent, which this xnu does not have.
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Validate patch hunk counts
        # git apply trusts the declared counts: a header that undercounts its
        # body makes git drop the trailing lines "cleanly".
        run: python3 xnu-avicii/tools/check-hunk-counts.py xnu-avicii/patches

      - name: Resolve and pin the xnu tag
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/apple-oss-distributions/distribution-macOS/macos-${MACOS_VERSION//./}/release.json"
          got=$(curl -sf "$url" | jq -r '.projects[] | select(.project=="xnu") | .tag')
          echo "release.json for macOS $MACOS_VERSION -> $got"
          if [ "$got" != "$XNU_TAG" ]; then
            echo "::error::macOS $MACOS_VERSION now maps to $got, series was built against $XNU_TAG"
            exit 1
          fi

      - name: Fetch build script and xnu
        run: |
          set -euo pipefail
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          test "$(git -C dxb rev-parse HEAD)" = "$DXB_SHA"
          # get_xnu() in build.sh skips its own clone when this exists, so the
          # tree it builds is exactly the one the series was verified against.
          git clone -q --depth 1 --branch "$XNU_TAG" "$XNU_REPO" dxb/xnu
          test "$(git -C dxb/xnu rev-parse HEAD)" = "$(git -C dxb/xnu rev-parse "$XNU_TAG^{commit}")"
          git -C dxb/xnu log --oneline -1
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh

      - name: Stage sources (patches/*.sh)
        # These fetch immutable Apple/BearSSL commits and copy files into the
        # tree; they run from the xnu root, exactly as build.sh would run them.
        working-directory: dxb/xnu
        run: |
          set -euo pipefail
          while read -r verb file; do
            case "$verb" in ''|'#'*) continue;; esac
            [ "$verb" = copy ] || continue
            echo "::group::stage $file"
            MACHINE_CONFIG="$MACHINE_CONFIG" MACOS_VERSION="$MACOS_VERSION" \
              bash "../../xnu-avicii/patches/$file"
            echo "::endgroup::"
          done < ../../xnu-avicii/series

      - name: Apply the series
        # --check first, per file, so the failing patch is named. `set -e` at
        # job level plus the explicit `|| exit` make a non-applying patch fatal.
        working-directory: dxb/xnu
        run: |
          set -euo pipefail
          n=0
          while read -r verb file; do
            case "$verb" in ''|'#'*) continue;; esac
            [ "$verb" = apply ] || continue
            n=$((n + 1))
            p="../../xnu-avicii/patches/$file"
            if ! out=$(git apply --check --whitespace=nowarn "$p" 2>&1); then
              echo "::error::does not apply: $file (entry $n)"
              echo "$out"
              exit 1
            fi
            git apply --whitespace=nowarn "$p"
            echo "applied $n: $file"
          done < ../../xnu-avicii/series
          echo "$n patches applied in series order"
          # build.sh globs ../patches for a 13.5 build: it would re-run the same
          # stage scripts and re-apply the upstream .patch files this series
          # already carries. Move them out of its glob rather than deleting them.
          if [ -n "$(ls -A ../patches 2>/dev/null)" ]; then
            mkdir -p ../patches-upstream
            mv ../patches/* ../patches-upstream/
            echo "moved $(ls -A ../patches-upstream | wc -l) upstream entries out of dxb/build.sh's glob"
          fi

      - name: Dry-run summary
        if: env.MODE == 'dry-run'
        run: |
          echo "series applies to $XNU_TAG in order; no build requested"
          git -C dxb/xnu status --short | tail -5

      - name: Deps
        if: env.MODE == 'build'
        run: |
          set -euo pipefail
          brew install jq gum bash cmake ninja
          # build.sh only checks that xcodes exists (Xcode is preinstalled)
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Build
        if: env.MODE == 'build'
        working-directory: dxb
        env:
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: |
          set -o pipefail
          bash build.sh 2>&1 | tee ../build.log

      - name: Fail on skipped or unapplied project patches
        if: always()
        run: |
          if [ ! -f build.log ]; then
            echo "no build.log (dry-run or early failure)"; exit 0
          fi
          if grep -E 'Skipping patch .*/patches/[0-9]{4}-' build.log; then
            echo "::error::a series patch was skipped by build.sh"
            exit 1
          fi
          echo "no series patch was skipped"

      - name: Collect
        if: always()
        run: |
          set -euo pipefail
          mkdir -p out
          # The KDK install step runs xnu's lldbmacros tooling, whose Python
          # relative imports break on the runner's Python 3, so `make install`
          # can abort after the kernel is already linked. Take it from the
          # object dir as well as from the fakeroot.
          cp -v dxb/fakeroot/System/Library/Kernels/kernel.* out/ 2>/dev/null || true
          find dxb/build -maxdepth 4 -type f -name 'kernel.*' -exec cp -v {} out/ \; 2>/dev/null || true
          ls -la out || true
          ( cd out && shasum -a 256 kernel.* > SHA256SUMS ) || true
          cat out/SHA256SUMS 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel-sweet
          path: out/
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

