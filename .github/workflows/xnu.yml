name: xnu

# Builds the avicii kernel on a macOS runner. Linux cannot do this: the kernel
# needs Xcode, mig, libfirehose_kernel and the KDK, all macOS-only.
#
# The whole series in xnu-avicii/series is applied FIRST, by this workflow, in
# order, with `git apply --check` in front of every file. blacktop's build.sh
# would otherwise apply patches in glob order and downgrade a failure to a
# warning; with the files staged outside its patches/ dir nothing is skipped
# silently. xnu-avicii/series is the only order that exists.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = apply the series and stop, build = full kernel build"
        type: choice
        options: [dry-run, build]
        default: build
      macos_version:
        description: "macOS release whose xnu to build (13.5 = xnu-8796.141.3, iOS 16 era)"
        default: "13.5"
      kernel_config:
        description: "DEVELOPMENT / RELEASE / DEBUG"
        default: DEVELOPMENT
      machine_config:
        description: "xnu MACHINE_CONFIG"
        default: SWEET
      runner:
        description: "Build runner pool"
        type: choice
        options: [xnu-vm, macos-15-intel, macos-15]
        default: xnu-vm
      keep_going:
        description: "make -k (collect every compile error in one run)"
        default: "true"
  push:
    # There is no `main` on this repo: the default branch is `master` and the
    # per-rung work lives on kern-NNNN branches. A manual dispatch was the only
    # way to get a build before this.
    branches: [master, "kern-*"]
    paths:
      - "xnu-avicii/patches/**"
      - "xnu-avicii/series"
      - "xnu-avicii/tools/check-hunk-counts.py"
      - ".github/workflows/xnu.yml"

# concurrency removed for diagnosis 2026-11-12: every dispatch was cancelled in 2 s

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  XNU_REPO: https://github.com/apple-oss-distributions/xnu
  # macOS 13.5 ships xnu-8796.141.3 (Apple release.json for macos-135). The
  # series was written against this exact tag; the resolve step below re-checks
  # it so a repointed release fails here instead of producing a wrong kernel.
  XNU_TAG: xnu-8796.141.3
  HFS_TAG_NOTE: hfs/pthread/BearSSL are fetched pinned by xnu-avicii/patches/*.sh
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SWEET' }}
  MODE: ${{ inputs.mode || 'build' }}

jobs:
  build:
    # Pushes build on the local VM runner (cold 3 min vs ~12 min hosted, no queue).
    # If the VM is down, dispatch with runner=macos-15-intel.
    runs-on: ${{ (inputs.runner || 'xnu-vm') == 'xnu-vm' && fromJSON('["self-hosted", "xnu-vm"]') || inputs.runner }}
    timeout-minutes: 120
    env:
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "1"
      # content, not mtime: a newer runner image ships a different Xcode at the
      # same path, and an object built by the old clang must not be served.
      CCACHE_COMPILERCHECK: content
      # XNU embeds __DATE__/__TIME__ and its guarded headers carry check-out
      # mtimes that differ per run; without these the kernel never hits.
      CCACHE_SLOPPINESS: file_stat_matches,include_file_ctime,include_file_mtime,time_macros,locale,clang_index_store
    steps:
      - uses: actions/checkout@v4

      - name: Configure cache directory
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          if [ "$RUNNER_KIND" = self-hosted ]; then
            echo "CCACHE_DIR=$HOME/ccache" >> "$GITHUB_ENV"
            echo "CCACHE_MAXSIZE=20G" >> "$GITHUB_ENV"
          else
            echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
          fi

      - name: Validate patch hunk counts
        # git apply trusts the declared counts: a header that undercounts its
        # body makes git drop the trailing lines "cleanly".
        run: python3 xnu-avicii/tools/check-hunk-counts.py xnu-avicii/patches

      - name: Resolve and pin the xnu tag
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/apple-oss-distributions/distribution-macOS/macos-${MACOS_VERSION//./}/release.json"
          got=$(curl -sf "$url" | jq -r '.projects[] | select(.project=="xnu") | .tag')
          echo "release.json for macOS $MACOS_VERSION -> $got"
          if [ "$got" != "$XNU_TAG" ]; then
            echo "::error::macOS $MACOS_VERSION now maps to $got, series was built against $XNU_TAG"
            exit 1
          fi

      - name: Fetch build script and xnu
        env:
          CCACHE_WRAP: ${{ runner.temp }}/ccache-bin
        run: |
          set -euo pipefail
          if [ "${{ runner.environment }}" = self-hosted ]; then
            bash tooling/macvm/prepare-sources.sh
          else
            git init -q dxb
            git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
            git -C dxb checkout -q FETCH_HEAD
            git clone -q --depth 1 --branch "$XNU_TAG" "$XNU_REPO" dxb/xnu
          fi
          test "$(git -C dxb rev-parse HEAD)" = "$DXB_SHA"
          # get_xnu() in build.sh skips its own clone when this exists, so the
          # tree it builds is exactly the one the series was verified against.
          test "$(git -C dxb/xnu rev-parse HEAD)" = "$(git -C dxb/xnu rev-parse "$XNU_TAG^{commit}")"
          git -C dxb/xnu log --oneline -1
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          # ccache. xnu compiles with $(CC) from the environment: MakeInc.cmd
          # only substitutes CC when `$(origin CC)` is `default`, and build.sh
          # exports CC as the absolute Xcode clang path -- so a PATH-only shim is
          # never called for the kernel objects. Rewrite the two exports to the
          # shims (clang only; LD/AR/RANLIB/STRIP stay as they are, the linker is
          # not cached).
          sed -i '' "s|export CC=.*xcrun -find clang).*|export CC=\"${CCACHE_WRAP}/clang\"|" dxb/build.sh
          sed -i '' "s|export CXX=.*xcrun -find clang++.*|export CXX=\"${CCACHE_WRAP}/clang++\"|" dxb/build.sh
          grep -n -E '^[[:space:]]*export (CC|CXX)=' dxb/build.sh
          test "$(grep -c "export CC=\"${CCACHE_WRAP}/clang\"" dxb/build.sh)" = 1
          test "$(grep -c "export CXX=\"${CCACHE_WRAP}/clang++\"" dxb/build.sh)" = 1

      - name: Stage sources (patches/*.sh)
        # These fetch immutable Apple/BearSSL commits and copy files into the
        # tree; they run from the xnu root, exactly as build.sh would run them.
        working-directory: dxb/xnu
        run: |
          set -euo pipefail
          while read -r verb file; do
            case "$verb" in ''|'#'*) continue;; esac
            [ "$verb" = copy ] || continue
            echo "::group::stage $file"
            MACHINE_CONFIG="$MACHINE_CONFIG" MACOS_VERSION="$MACOS_VERSION" \
              bash "$GITHUB_WORKSPACE/xnu-avicii/patches/$file"
            echo "::endgroup::"
          done < "$GITHUB_WORKSPACE/xnu-avicii/series"

      - name: Apply the series
        # --check first, per file, so the failing patch is named. `set -e` at
        # job level plus the explicit `|| exit` make a non-applying patch fatal.
        working-directory: dxb/xnu
        run: |
          set -euo pipefail
          n=0
          while read -r verb file; do
            case "$verb" in ''|'#'*) continue;; esac
            [ "$verb" = apply ] || continue
            n=$((n + 1))
            p="$GITHUB_WORKSPACE/xnu-avicii/patches/$file"
            if ! out=$(git apply --check --whitespace=nowarn "$p" 2>&1); then
              echo "::error::does not apply: $file (entry $n)"
              echo "$out"
              exit 1
            fi
            git apply --whitespace=nowarn "$p"
            echo "applied $n: $file"
          done < "$GITHUB_WORKSPACE/xnu-avicii/series"
          echo "$n patches applied in series order"
          # build.sh globs ../patches for a 13.5 build: it would re-run the same
          # stage scripts and re-apply the upstream .patch files this series
          # already carries. Move them out of its glob rather than deleting them.
          if [ -n "$(ls -A ../patches 2>/dev/null)" ]; then
            mkdir -p ../patches-upstream
            mv ../patches/* ../patches-upstream/
            echo "moved $(ls -A ../patches-upstream | wc -l) upstream entries out of dxb/build.sh's glob"
          fi

      - name: Dry-run summary
        if: env.MODE == 'dry-run'
        run: |
          echo "series applies to $XNU_TAG in order; no build requested"
          git -C dxb/xnu status --short | tail -5

      - name: Deps
        if: env.MODE == 'build'
        env:
          CCACHE_WRAP: ${{ runner.temp }}/ccache-bin
        run: |
          set -euo pipefail
          # Self-hosted (the macOS VM): the tools live in /usr/local/bin and there
          # is no Homebrew, so put that dir first and only brew what is absent.
          if [ "${{ runner.environment }}" = self-hosted ]; then
            echo /usr/local/bin >> "$GITHUB_PATH"
            export PATH="/usr/local/bin:$PATH"
            missing=""
            for t in jq gum bash cmake ninja ccache; do
              command -v "$t" >/dev/null || missing="$missing $t"
            done
            if [ -n "$missing" ]; then
              command -v brew >/dev/null || { echo "self-hosted deps missing:$missing (no brew)" >&2; exit 1; }
              brew install $missing
            fi
            for t in jq gum bash cmake ninja ccache; do printf '%s -> %s\n' "$t" "$(command -v "$t")"; done
          else
            brew install jq gum bash cmake ninja ccache
          fi
          # build.sh only checks that xcodes exists (Xcode is preinstalled)
          if [ "${{ runner.environment }}" != self-hosted ]; then
            printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
            sudo chmod +x /usr/local/bin/xcodes
          fi
          sw_vers
          ls -d /Applications/Xcode*.app
          if [ "${{ runner.environment }}" = self-hosted ]; then
            XC=$(xcode-select -p)
            XC=${XC%/Contents/Developer}
          else
            XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          fi
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          if [ "${{ runner.environment }}" != self-hosted ]; then
            sudo xcode-select -s "$XC"
          fi
          xcodebuild -version
          xcrun --find iig
          # ccache shims. Resolve the real Xcode compilers once, here, and bake
          # the absolute paths into the shims: xcrun -find ignores PATH, so a shim
          # named clang can never recurse into itself.
          CCACHE_BIN=$(command -v ccache)
          REAL_CC=$(xcrun -find clang)
          REAL_CXX=$(xcrun -find clang++)
          echo "ccache: $CCACHE_BIN ($(ccache --version | head -1))"
          echo "ccache covers: $REAL_CC"
          echo "ccache covers: $REAL_CXX"
          mkdir -p "$CCACHE_DIR" "$CCACHE_WRAP"
          for t in clang cc; do
            printf '#!/bin/sh\nexec "%s" "%s" "$@"\n' "$CCACHE_BIN" "$REAL_CC" > "$CCACHE_WRAP/$t"
          done
          for t in clang++ c++; do
            printf '#!/bin/sh\nexec "%s" "%s" "$@"\n' "$CCACHE_BIN" "$REAL_CXX" > "$CCACHE_WRAP/$t"
          done
          chmod +x "$CCACHE_WRAP"/clang "$CCACHE_WRAP"/cc "$CCACHE_WRAP"/clang++ "$CCACHE_WRAP"/c++
          echo "$CCACHE_WRAP" >> "$GITHUB_PATH"
          cat "$CCACHE_WRAP/clang"
          # Smoke test: the shim must produce a real preprocess and show up in
          # ccache's counters, otherwise the wiring is decorative.
          echo 'int x;' | "$CCACHE_WRAP/clang" -E -x c - >/dev/null
          ccache -s -v

      - name: Restore ccache
        # The key carries the run id, so every run writes its own entry (a hit on
        # the key itself would mean no save). restore-keys matches the prefix,
        # which is what actually warms the build from an earlier run's cache.
        if: runner.environment != 'self-hosted'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ env.XNU_TAG }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.XNU_TAG }}-

      - name: ccache stats before
        # Deliberately not gated on inputs.mode: a dispatch or push must always
        # show what the cache contributed.
        run: |
          mkdir -p "$CCACHE_DIR"
          if ! command -v ccache >/dev/null; then
            echo "ccache not installed yet (MODE=$MODE)"; exit 0
          fi
          echo "CCACHE_DIR=$CCACHE_DIR"
          ccache -s -v

      - name: Build
        if: env.MODE == 'build'
        working-directory: dxb
        env:
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
          # build.sh execs make; ccache in the CC shim reads this from the
          # inherited environment, so it must match the restored cache dir.
        run: |
          set -o pipefail
          if [ "${{ runner.environment }}" = self-hosted ] && [ ! -d /Library/Developer/KDKs/KDK_13.5_22G74.kdk ]; then
            echo "::error::Run tooling/macvm/provision.sh interactively to install the target KDK first"
            exit 1
          fi
          # lldbmacros' Python relative imports break on the runner's python3, so
          # `make install` aborts *after* the kernel linked. Tolerate exactly that:
          # fail only when no valid Mach-O came out.
          bash build.sh 2>&1 | tee "$GITHUB_WORKSPACE/build.log" || {
            cfg_lc=$(echo "$KERNEL_CONFIG" | tr '[:upper:]' '[:lower:]')
            k=build/xnu.obj/${KERNEL_CONFIG}_ARM64_SWEET/kernel${cfg_lc:+.$cfg_lc}.sweet
            if [ -f "$k" ] && file "$k" | grep -q 'Mach-O'; then
              echo "::warning::build.sh exited nonzero but the kernel is linked (lldbmacros install abort); continuing"
            else
              exit 1
            fi
          }

      - name: ccache stats after
        if: always()
        run: |
          if ! command -v ccache >/dev/null; then
            echo "ccache not installed (MODE=$MODE)"; exit 0
          fi
          ccache -s -v

      - name: Fail on skipped or unapplied project patches
        if: always()
        run: |
          if [ ! -f build.log ]; then
            echo "no build.log (dry-run or early failure)"; exit 0
          fi
          if grep -E 'Skipping patch .*/patches/[0-9]{4}-' build.log; then
            echo "::error::a series patch was skipped by build.sh"
            exit 1
          fi
          echo "no series patch was skipped"

      - name: Collect
        if: always()
        run: |
          set -euo pipefail
          mkdir -p out
          # The KDK install step runs xnu's lldbmacros tooling, whose Python
          # relative imports break on the runner's Python 3, so `make install`
          # can abort after the kernel is already linked. Take it from the
          # object dir as well as from the fakeroot.
          cp -v dxb/fakeroot/System/Library/Kernels/kernel.* out/ 2>/dev/null || true
          find dxb/build -maxdepth 4 -type f -name 'kernel.*' -exec cp -v {} out/ \; 2>/dev/null || true
          ls -la out || true
          ( cd out && shasum -a 256 kernel.* > SHA256SUMS ) || true
          cat out/SHA256SUMS 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel-sweet
          path: out/
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

